name: Dispatch Knowledgebase Build (placeholder)

on:
  push:
    branches: [ main ]

jobs:
  dispatch-kb:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Dispatch to Knowledgebase (repository_dispatch)
        env:
          KB_TOKEN: ${{ secrets.KB_DISPATCH_TOKEN }}
        run: |
          if [ -z "${KB_TOKEN}" ]; then
            echo "KB_DISPATCH_TOKEN not set; skipping dispatch." >&2
            exit 0
          fi
          payload=$(jq -n --arg sha "${GITHUB_SHA}" '{event_type:"content-updated", client_payload:{gitopedia_sha:$sha}}')
          curl -s -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: token ${KB_TOKEN}" \
            https://api.github.com/repos/gitopedia/knowledge-base/dispatches \
            -d "${payload}"


