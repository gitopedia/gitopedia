name: Category Indexes

on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build-category-indexes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      - name: Generate category indexes
        run: |
          go run cmd/category-indexer/main.go
      - name: Check for changes
        id: diff
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "changes=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Commit and push (PR from same repo)
        if: github.event_name == 'pull_request' && steps.diff.outputs.changes == 'true' && github.event.pull_request.head.repo.fork == false
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: auto-generate category indexes"
          git push
      - name: Fail if changes (PR from fork)
        if: github.event_name == 'pull_request' && steps.diff.outputs.changes == 'true' && github.event.pull_request.head.repo.fork == true
        run: |
          echo "Category indexes out of date. Please re-run the generator locally." >&2
          exit 1
      - name: Commit and push on main
        if: github.event_name == 'push' && steps.diff.outputs.changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: update category indexes on main"
          git push
