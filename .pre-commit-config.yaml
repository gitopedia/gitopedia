repos:
  - repo: local
    hooks:
      - id: build-category-indexes
        name: Build category indexes
        entry: python scripts/build_category_indexes.py
        language: system
        pass_filenames: false
      - id: validate-authority-and-front-matter
        name: Validate authority and front matter
        entry: python scripts/validate_authority_and_facets.py
        language: system
        pass_filenames: false


